name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unpack game
        run: Expand-Archive -Path windows.zip -DestinationPath game

      - name: Install tools
        run: pip install pygame-ce pyinstaller

      - name: Build exe
        working-directory: game
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ButtonAndGun --icon icon.ico
          --add-data "music.mp3;." --add-data "shot.mp3;." --add-data "click.mp3;." --add-data "icon.ico;."
          antiend.py

      - uses: actions/upload-artifact@v4
        with:
          name: ButtonAndGun-windows
          path: game/dist/ButtonAndGun.exe
